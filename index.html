<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-text="title">Platform Engineering Maturity Model Assessment</title>
  <link rel="stylesheet" href="./assets/maturity-assessment.css" />
</head>

<body>
  <main class="container">
    <article class="form-section">
      <header>
        <h1 data-text="title">Assessment</h1>
        <div class="progress-indicator">
          <span id="page-indicator">Page 1 of 5</span>
        </div>
      </header>
      <div class="intro" id="intro-section">
        <h2 data-text="introTitle"></h2>
        <div id="intro-content"></div>
      </div>

      <form id="maturity-form">
        <!-- Questions will be dynamically loaded from YAML data -->
      </form>

      <div class="pagination-controls">
        <button type="button" id="prev-btn" onclick="previousPage()" disabled>← Previous</button>
        <button type="button" id="next-btn" onclick="nextPage()">Next →</button>
        <button type="button" id="submit-btn" onclick="submitAssessment()" style="display: none;">Submit
          Assessment</button>
      </div>
    </article>

    <article class="chart-section" id="results-section" style="display: none;">
      <header>
        <h1 data-text="results_title">Assessment Results</h1>
      </header>

      <div class="charts">
        <canvas id="maturity-spider"></canvas>
      </div>

      <div class="charts">
        <table id="maturity-matrix" class="scores"></table>
      </div>



      <div id="congrats-section" style="display: none;">
        <h2 data-text="congrats_title">Congratulations!</h2>
        <p data-text="congrats_message"></p>
      </div>

      <div id="advice-section" class="advice-container" style="display: none;">
        <h2 data-text="advice_title"></h2>
        <div id="category-advice" class="category-advice"></div>
        <div id="question-advice" class="question-advice-grid"></div>
      </div>

      <div class="action-buttons">
        <button onclick="returnToAssessment()" class="return-button" id="app-return-button">← Back to
          Assessment</button>
      </div>

      <div class="share-button">
        <a onclick="copyURLToClipboard(this)" data-text="copy_link_text">📋 Copy Shareable Link</a>
      </div>
    </article>
  </main>

  <script src="./assets/maturity-assessment.js" data-questions="./data/continuous-delivery-assessment.json"></script>
</body>

</html>
